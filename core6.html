<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta de Navidad</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    font-family:'Georgia', serif;
    overflow:hidden;
}

/* ===== VIDEO ===== */
.video-fondo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-1;
}

/* ===== CONTENEDOR ===== */
.contenedor{
    height:100%;
    display:flex;
    justify-content:center;
    color:white;
    overflow-y:auto;
    padding:30px 15px;
}

/* ===== INICIO ===== */
.inicio{
    text-align:center;
    margin-top:80px;
}

.sobre{
    font-size:80px;
    cursor:pointer;
    transition:transform .3s;
}

.sobre:active{
    transform:scale(.9);
}

.texto{
    margin-top:15px;
    font-size:18px;
}

/* ===== CARTA ===== */
.carta{
    background:#fffaf0;
    color:#333;
    padding:22px;
    border-radius:18px;
    max-width:700px;
    box-shadow:0 0 25px rgba(0,0,0,.6);
    animation:abrir .8s ease;
}

@keyframes abrir{
    from{opacity:0; transform:scale(.85);}
    to{opacity:1; transform:scale(1);}
}

.titulo{
    color:#b11226;
    font-size:24px;
    margin-bottom:12px;
    text-align:center;
}

.firma{
    margin-top:18px;
    font-style:italic;
    text-align:right;
}

/* ===== RECUERDOS ===== */
.recuerdos{
    background:rgba(255,255,255,.95);
    color:#333;
    padding:20px;
    border-radius:18px;
    max-width:900px;
}

.recuerdos h2{
    color:#b11226;
    text-align:center;
    margin-bottom:15px;
}

.categorias{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;
}

.categoria{
    border:2px dashed #b11226;
    border-radius:14px;
    padding:15px;
}

.categoria h3{
    color:#1e7f3b;
    margin-bottom:10px;
    text-align:center;
}

.imagenes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.imagenes img{
    width:100%;
    height:80px;
    object-fit:cover;
    border-radius:10px;
    background:#ddd;
}

/* ===== BOTONES ===== */
.boton{
    margin:25px auto 10px;
    padding:14px 26px;
    background:#1e7f3b;
    color:white;
    border:none;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
    width:80%;
    max-width:300px;
}

.boton:active{
    transform:scale(.95);
}
</style>
</head>

<body>

<!-- VIDEO -->
<video class="video-fondo" autoplay muted loop playsinline>
    <source src="fondo.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="contenedor">

    <!-- INICIO -->
    <div id="inicio" class="inicio">
        <div class="sobre" onclick="abrirCarta()">📩</div>
        <div class="texto">Presione para abrir</div>
    </div>

    <!-- CARTA -->
    <div id="contenido" style="display:none;">
        <div class="carta">
            <div class="titulo">🎄 Feliz Navidad 🎄</div>

            <p>Que esta Navidad llene tu vida de paz, amor y momentos inolvidables.</p>
            <p>Gracias por todo lo bonito que compartimos y por cada recuerdo creado.</p>

            <div class="firma">
                ❄️ Con cariño ❄️<br>
                Santa 🎅
            </div>

            <button class="boton" onclick="verRecuerdos()">➡️ Ver recuerdos</button>
        </div>
    </div>

    <!-- RECUERDOS -->
    <div id="recuerdos" style="display:none;">
        <div class="recuerdos">
            <h2>💖 Cosas que me recuerdan a ti 💖</h2>

            <div class="categorias">

                <div class="categoria">
                    <h3>🎭 Personajes</h3>
                    <div class="imagenes">
                        <img src="personaje1.jpg">
                        <img src="personaje2.jpg">
                        <img src="personaje3.jpg">
                    </div>
                </div>

                <div class="categoria">
                    <h3>📸 Fotos juntos</h3>
                    <div class="imagenes">
                        <img src="foto1.jpg">
                        <img src="foto2.jpg">
                        <img src="foto3.jpg">
                    </div>
                </div>

                <div class="categoria">
                    <h3>🎮 Juegos</h3>
                    <div class="imagenes">
                        <img src="juego1.jpg">
                        <img src="juego2.jpg">
                        <img src="juego3.jpg">
                    </div>
                </div>

            </div>

            <button class="boton" onclick="regresar()">🔙 Regresar</button>
        </div>
    </div>

</div>

<script>
function abrirCarta(){
    inicio.style.display="none";
    contenido.style.display="block";
    window.scrollTo(0,0);
}

function verRecuerdos(){
    contenido.style.display="none";
    recuerdos.style.display="block";
    window.scrollTo(0,0);
}

function regresar(){
    recuerdos.style.display="none";
    inicio.style.display="block";
    window.scrollTo(0,0);
}
</script>

</body>
</html>
